name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  testes:
    name: Testes (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Pacote: roda no PHP de quem instala, então testa todas as versões aceitas.
        php: ['8.2', '8.3', '8.4']
    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Dependências
        run: composer update --no-interaction --prefer-dist --no-progress

      - name: Estilo (Pint)
        run: vendor/bin/pint --test

      - name: Testes
        run: vendor/bin/phpunit
